name: alpaca-probe
on:
  push:
    paths: [scripts/alpaca_probe.py, .github/workflows/alpaca-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", sparse-checkout: scripts }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/alpaca_probe.py
