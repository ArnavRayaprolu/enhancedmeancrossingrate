name: kaggle-data

# Downloads Kaggle dataset leukipp/hourly-stock-prices with kagglehub on a
# GitHub-hosted runner and commits hourly price panels to data/kaggle_hourly/.
# Optional repository secrets KAGGLE_USERNAME / KAGGLE_KEY are used if set.

on:
  push:
    paths:
      - scripts/download_kaggle.py
      - .github/workflows/kaggle-data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install kagglehub pandas numpy pyarrow

      - name: Download and convert
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/download_kaggle.py

      - name: Commit data/kaggle_hourly
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -f data/kaggle_hourly || exit 0
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: kaggle hourly-stock-prices (downloaded by GitHub Actions)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 10))
          done
          exit 1
