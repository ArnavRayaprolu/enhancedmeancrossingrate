name: alpaca-daily-full

# Daily OHLCV (2016 onward) for every common stock and unleveraged ETF/fund.
# Edit .github/alpaca-daily-full-run.txt to start.

on:
  push:
    paths:
      - .github/alpaca-daily-full-run.txt

permissions:
  contents: write

concurrency:
  group: alpaca-daily-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy pyarrow requests
      - run: python scripts/download_alpaca.py daily_full
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -f data/alpaca/daily_full || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data: alpaca daily OHLCV, all stocks and ETFs (GitHub Actions)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 10))
          done
          exit 1
